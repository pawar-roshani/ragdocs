name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ragdocs
          POSTGRES_PASSWORD: ragdocs
          POSTGRES_DB: ragdocs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ragdocs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://ragdocs:ragdocs@localhost:5432/ragdocs
      TEST_DATABASE_URL: postgresql+psycopg://ragdocs:ragdocs@localhost:5432/ragdocs
      API_KEY: ci-test-key

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -q
