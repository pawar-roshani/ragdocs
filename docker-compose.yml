services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ragdocs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragdocs}
      POSTGRES_DB: ${POSTGRES_DB:-ragdocs}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ragdocs}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ragdocs}:${POSTGRES_PASSWORD:-ragdocs}@db:5432/${POSTGRES_DB:-ragdocs}
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ragdocs}:${POSTGRES_PASSWORD:-ragdocs}@db:5432/${POSTGRES_DB:-ragdocs}
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/data/uploads

volumes:
  pgdata:
  uploads:
